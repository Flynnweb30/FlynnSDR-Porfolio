<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Glass Orb Base Gradient -->
    <radialGradient id="orbGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="60%" stop-color="rgba(0,255,0,0.02)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.9)" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Reflection Filter -->
    <filter id="reflectionBlur">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <!-- Thicker Neon Tube Style -->
    <style>
      .neon-tube {
        fill: none;
        stroke: #00FF00;
        stroke-width: 22; /* Increased from 12 */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .neon-core {
        fill: none;
        stroke: #FFFFFF;
        stroke-width: 8; /* Increased from 4 */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Glass Orb Base -->
  <circle cx="250" cy="230" r="160" fill="url(#orbGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  
  <!-- Glass Orb Edge Highlights -->
  <path d="M 120 150 A 160 160 0 0 1 250 70" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round" />
  <path d="M 380 310 A 160 160 0 0 1 250 390" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" stroke-linecap="round" />

  <!-- Neon Reflection on Glass -->
  <g filter="url(#reflectionBlur)" opacity="0.3">
    <path d="M 220 140 L 310 140 M 220 140 L 220 320 M 220 230 L 280 230" stroke="#00FF00" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
    <text x="250" y="450" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#00FF00" text-anchor="middle" letter-spacing="4">OPENER</text>
  </g>

  <!-- The Thicker Neon Letter "F" -->
  <g filter="url(#neonGlow)">
    <!-- Green glowing thick tube -->
    <path class="neon-tube" d="M 215 130 L 315 130 M 215 130 L 215 330 M 215 230 L 285 230" />
    <!-- White hot core of the thick tube -->
    <path class="neon-core" d="M 215 130 L 315 130 M 215 130 L 215 330 M 215 230 L 285 230" />
  </g>

  <!-- The Neon Text "OPENER" -->
  <g filter="url(#neonGlow)">
    <text x="250" y="450" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="none" stroke="#00FF00" stroke-width="10" stroke-linejoin="round" text-anchor="middle" letter-spacing="6">OPENER</text>
    <text x="250" y="450" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">OPENER</text>
  </g>
</svg>