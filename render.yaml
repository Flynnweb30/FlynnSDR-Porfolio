services:
  - type: web
    name: flynn-sdr-portfolio
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /media/*
        destination: /media/*
      - type: rewrite
        source: /assets/*
        destination: /assets/*
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /google16f708e76dbcb521.html
        destination: /google16f708e76dbcb521.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /media/*.mp4
        name: Content-Type
        value: video/mp4
      - path: /media/*.mp3
        name: Content-Type
        value: audio/mpeg
      - path: /media/*.png
        name: Content-Type
        value: image/png
      - path: /media/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups